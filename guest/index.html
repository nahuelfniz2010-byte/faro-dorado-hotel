<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faro Dorado - App del Huesped</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3d5c">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
:root{--brand:#0b3d5c;--gold:#c9a227;--bg:#f4f7fa;--card:#fff;--ok:#1a7f37;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#12212b}
header{background:var(--brand);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}header small{opacity:.8}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{font-size:15px;margin:0 0 10px;color:var(--brand)}
label{display:block;font-size:12px;margin:8px 0 3px;color:#456}
input,select,textarea{width:100%;padding:9px;border:1px solid #cdd7e0;border-radius:8px;font-size:14px}
button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;margin-top:8px}
button.sec{background:#e2e8ee;color:#12212b}button.gold{background:var(--gold);color:#12212b}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.verde{background:#d7f5dd;color:var(--ok)}.sucia{background:#fde8cf;color:var(--warn)}.con_falla{background:#fdd;color:var(--bad)}.fuera_servicio{background:#e5e7eb;color:#374151}.limpia{background:#dbeafe;color:#1d4ed8}
.hidden{display:none}.muted{color:#678;font-size:12px}
.msg{padding:8px;border-radius:8px;margin:6px 0;font-size:13px}.msg.me{background:#e2e8ee}.msg.staff{background:#eafaf0}
.badge{background:var(--gold);color:#12212b;padding:4px 10px;border-radius:8px;font-weight:700;letter-spacing:1px}
</style>
</head>
<body>
<header><h1>Faro Dorado <small>· App del Huesped</small></h1><div id="who" class="muted" style="color:#cfe"></div></header>
<main>
<div id="login" class="card">
  <h2>Ingresar con codigo de reserva</h2>
  <label>Codigo de reserva (FD-XXXXXX)</label><input id="code" placeholder="FD-104821">
  <label>Email del titular</label><input id="email" placeholder="alma.bruma@test">
  <label>Contrasena</label><input id="pass" type="password" placeholder="Huesped2026!">
  <button onclick="login()">Ingresar</button>
  <p class="muted">Prueba: FD-104821 / alma.bruma@test / Huesped2026!</p>
</div>
<div id="app" class="hidden">
  <div class="card"><h2>Mi reserva</h2><div id="resv"></div></div>
  <div class="card"><h2>Check-in previo</h2><div id="precheck"></div></div>
  <div class="card"><h2>Elegir habitacion (solo verdes)</h2><div id="rooms"></div></div>
  <div class="card"><h2>Servicios</h2><div id="services"></div></div>
  <div class="card"><h2>Pedidos y fallas</h2><div id="requests"></div><button class="sec" onclick="loadRequests()">Actualizar</button></div>
  <div class="card"><h2>Chat con recepcion</h2><div id="chat"></div><input id="chatmsg" placeholder="Escribi tu mensaje"><button onclick="sendChat()">Enviar</button></div>
  <div class="card"><h2>Mis datos (consentimiento)</h2><div id="mydata"></div><button class="sec" onclick="eraseData()">Borrar mis datos</button></div>
</div>
</main>
<script>
const sb = supabase.createClient(FD_CONFIG.SUPABASE_URL, FD_CONFIG.SUPABASE_ANON_KEY);
let booking=null, guest=null;
function el(id){return document.getElementById(id)}
function pill(s){return '<span class="pill '+s+'">'+s.replace('_',' ')+'</span>'}
async function login(){
  const email=el('email').value.trim(), pass=el('pass').value, code=el('code').value.trim().toUpperCase();
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){alert('No se pudo ingresar: '+error.message);return}
  const {data:g}=await sb.from('guests').select('*').eq('email',email).single();
  guest=g;
  const {data:b}=await sb.from('bookings').select('*').eq('code',code).eq('guest_id',g.id).single();
  if(!b){alert('No encontre esa reserva para tu usuario.');return}
  booking=b; el('login').classList.add('hidden'); el('app').classList.remove('hidden');
  el('who').textContent='Huesped: '+g.full_name;
  renderResv(); renderPrecheck(); loadRooms(); loadServices(); loadRequests(); loadChat(); renderData();
}
function renderResv(){
  el('resv').innerHTML='<div class="badge">'+booking.code+'</div><p>Habitacion: <b>'+(booking.room_number||'sin asignar')+'</b><br>Entrada: '+booking.check_in+' · Salida: '+booking.check_out+'<br>Estado: '+booking.status+' · Check-in previo: '+booking.precheck_status+'<br>Saldo pendiente: ARS '+Number(booking.balance_ars||0).toLocaleString('es-AR')+'</p>';
}
function renderPrecheck(){
  const done=booking.precheck_status==='aprobado';
  el('precheck').innerHTML= done
    ? '<p class="pill verde">Aprobado</p><p>Codigo para mostrar en recepcion: <b>'+(booking.precheck_code||'FD-OK-'+booking.code.slice(-4))+'</b></p>'
    : '<p>Completa tus datos, documento propio y de cada acompanante, firma y garantia simulada.</p><button onclick="doPrecheck()">Iniciar / retomar check-in previo</button>';
}
async function doPrecheck(){
  const code='FD-OK-'+booking.code.slice(-4);
  const {error}=await sb.from('bookings').update({precheck_status:'aprobado',precheck_code:code}).eq('id',booking.id);
  if(error){alert(error.message);return}
  booking.precheck_status='aprobado'; booking.precheck_code=code;
  await sb.from('audit_log').insert({entity:'booking',entity_id:booking.code,action:'precheck_aprobado',actor:guest.full_name,detail:{code}});
  renderPrecheck(); alert('Check-in previo aprobado. Codigo: '+code);
}
async function loadRooms(){
  const {data}=await sb.from('room_status').select('room_number,status_code,rooms(type_code,capacity)').eq('status_code','verde').limit(6);
  el('rooms').innerHTML=(data||[]).map(r=>'<div class="row" style="align-items:center"><span>Hab '+r.room_number+' · '+r.rooms.type_code+' · cap '+r.rooms.capacity+'</span> '+pill('verde')+' <button class="gold" onclick="pickRoom(\''+r.room_number+'\')">Elegir</button></div>').join('')+'<button class="sec" onclick="loadRooms()">Ver mas opciones</button>';
}
async function pickRoom(n){
  const {error}=await sb.from('bookings').update({room_number:n}).eq('id',booking.id);
  if(error){alert(error.message);return}
  booking.room_number=n; renderResv(); alert('Habitacion '+n+' elegida (sujeta a validacion de recepcion).');
}
async function loadServices(){
  const {data}=await sb.from('services').select('code,name,hours');
  el('services').innerHTML=(data||[]).map(s=>'<div class="row"><span>'+s.name+' <span class="muted">'+s.hours+'</span></span><button class="sec" onclick="bookService(\''+s.code+'\')">Reservar</button></div>').join('')
   +'<div class="row"><input id="wake" placeholder="Despertador HH:MM"><button class="sec" onclick="setWake()">Programar</button></div>'
   +'<div class="row"><button class="sec" onclick="toggleDnd()">No molestar / limpiar</button><button class="sec" onclick="reqEarly()">Early check-in</button><button class="sec" onclick="reqLate()">Late check-out</button></div>';
}
async function bookService(code){
  await sb.from('service_bookings').insert({booking_id:booking.id,service_code:code,status:'solicitada'});
  alert('Reserva de servicio solicitada (sujeta a confirmacion).');
}
async function setWake(){
  const t=el('wake').value; if(!t)return;
  await sb.from('wakeup_calls').insert({booking_id:booking.id,at_time:new Date().toISOString().slice(0,11)+t+':00'});
  alert('Despertador programado para '+t);
}
async function toggleDnd(){
  const v=!booking.dnd;
  await sb.from('bookings').update({dnd:v,dnd_since:v?new Date().toISOString():null}).eq('id',booking.id);
  booking.dnd=v; alert(v?'No molestar ACTIVADO (max 2 dias sin verificacion).':'No molestar desactivado.');
}
async function reqEarly(){await sb.from('bookings').update({early_checkin_requested:true}).eq('id',booking.id);alert('Early check-in solicitado. Recepcion decide segun disponibilidad (25% de una noche de 10 a 14h).');}
async function reqLate(){await sb.from('bookings').update({late_checkout_requested:true}).eq('id',booking.id);alert('Late check-out solicitado. Recepcion decide (25% hasta 13h).');}
async function loadRequests(){
  const {data}=await sb.from('requests').select('*').eq('booking_id',booking.id).order('received_at',{ascending:false});
  el('requests').innerHTML=(data||[]).map(r=>'<div class="card" style="box-shadow:none;border:1px solid #e5e7eb"><b>'+r.type+'</b> · '+r.status+' <span class="muted">'+new Date(r.received_at).toLocaleString('es-AR')+'</span><br>'+r.detail+'</div>').join('')
   +'<label>Nuevo pedido / falla</label><select id="rtype"><option value="toallas">Toallas</option><option value="amenities">Amenities</option><option value="room_service">Room service</option><option value="falla">Reportar falla</option><option value="limpieza">Limpieza</option></select><input id="rdetail" placeholder="Detalle"><button onclick="newReq()">Enviar</button>';
}
async function newReq(){
  const t=el('rtype').value,d=el('rdetail').value;
  await sb.from('requests').insert({booking_id:booking.id,room_number:booking.room_number,type:t,detail:d,status:'recibido'});
  await sb.from('audit_log').insert({entity:'request',action:'creado_huesped',actor:guest.full_name,detail:{type:t}});
  el('rdetail').value=''; loadRequests(); alert('Pedido enviado. El estado de la habitacion solo lo cambia el personal.');
}
async function loadChat(){
  const {data}=await sb.from('chat_messages').select('*').eq('booking_id',booking.id).order('created_at');
  el('chat').innerHTML=(data||[]).map(m=>'<div class="msg '+(m.sender==='huesped'?'me':'staff')+'"><b>'+m.sender+'</b>: '+m.body+'</div>').join('');
}
async function sendChat(){
  const b=el('chatmsg').value; if(!b)return;
  await sb.from('chat_messages').insert({booking_id:booking.id,sender:'huesped',body:b,lang:'es'});
  el('chatmsg').value=''; loadChat();
}
function renderData(){
  el('mydata').innerHTML='<p>'+guest.full_name+' · '+guest.email+'<br>Documento (ficticio): '+guest.doc_ref+'<br>Alergias: '+((guest.allergies||[]).join(', ')||'ninguna')+'<br>Consentimiento: '+(guest.consent?'otorgado':'no')+'</p>';
}
async function eraseData(){
  if(!confirm('Borrar tus datos personales? Esta accion es tu derecho.'))return;
  await sb.from('guests').update({doc_ref:null,email:null,allergies:null,preferences:'{}'}).eq('id',guest.id);
  alert('Datos personales borrados.');
}
</script>
</body>
</html>
